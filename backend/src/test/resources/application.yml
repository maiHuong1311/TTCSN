spring:
  datasource:
    url: jdbc:h2:mem:ckd;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
application:
  images:
    directory: target/test-images
  jwt:
    secret: test-secret-that-is-long-enough-for-local-unit-tests
    access-token-minutes: 60
  ai:
    base-url: ""
    api-key: ""
    connect-timeout-seconds: 1
    read-timeout-seconds: 1
  cors:
    allowed-origin: http://localhost:5173
